<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized Learning Path</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0 auto;
            padding: 2rem;
            background-color: #f5f5f7;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #111;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .input-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 1rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #results {
            margin-top: 2rem;
        }
        .result-card {
            background: #fff;
            border: 1px solid #eee;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            border-left: 4px solid #007bff;
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .result-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 0;
        }
        .result-score {
            background: #e9ecef;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
            color: #555;
        }
        .result-desc {
            color: #666;
            line-height: 1.5;
        }
        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
        }
        .error {
            color: #dc3545;
            text-align: center;
            padding: 1rem;
            background: #f8d7da;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Personalized Learning Path</h1>
        <p style="text-align: center; margin-bottom: 2rem; color: #666;">Enter your interests to generate a custom curriculum.</p>
        
        <div class="input-group">
            <label for="interest-1">Interest 1</label>
            <input type="text" id="interest-1" placeholder="e.g. Machine Learning">
        </div>
        <div class="input-group">
            <label for="interest-2">Interest 2</label>
            <input type="text" id="interest-2" placeholder="e.g. Python">
        </div>
        <div class="input-group">
            <label for="interest-3">Interest 3</label>
            <input type="text" id="interest-3" placeholder="e.g. Data Visualization">
        </div>

        <button id="generate-btn">Generate Path</button>

        <div id="results"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
